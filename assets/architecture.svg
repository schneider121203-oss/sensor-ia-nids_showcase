<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Sensor IA NIDS architecture</title>
  <desc id="desc">Passive traffic is converted by NFStream into 22-feature flows, scored by EIF, Autoencoder and LOF, fused into one anomaly score and sent to Wazuh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <style>
      .label{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#e6edf7;text-anchor:middle}
      .sub{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#9fb0c7;text-anchor:middle}
      .box{fill:#152238;stroke:#334a68;stroke-width:1.5}
      .model{fill:#142d2b;stroke:#2f766d;stroke-width:1.5}
      .accent{fill:#2c2143;stroke:#7058a3;stroke-width:1.5}
      .siem{fill:#30261a;stroke:#9a743d;stroke-width:1.5}
      .line{stroke:#718096;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <text x="600" y="45" class="label" font-size="22">Flow-based anomaly detection pipeline</text>
  <text x="600" y="70" class="sub">Passive capture · benign-only fitting · fixed score references · CPU inference</text>

  <rect x="45" y="145" width="145" height="90" rx="12" class="box"/>
  <text x="117" y="181" class="label">Traffic</text>
  <text x="117" y="207" class="sub">Mirror / PCAP</text>

  <rect x="235" y="145" width="145" height="90" rx="12" class="box"/>
  <text x="307" y="181" class="label">NFStream</text>
  <text x="307" y="207" class="sub">Bidirectional flows</text>

  <rect x="425" y="145" width="160" height="90" rx="12" class="box"/>
  <text x="505" y="181" class="label">Feature contract</text>
  <text x="505" y="207" class="sub">22 flow features</text>

  <rect x="640" y="100" width="135" height="66" rx="12" class="model"/>
  <text x="707" y="130" class="label">EIF</text>
  <text x="707" y="151" class="sub">Isolation</text>
  <rect x="640" y="182" width="135" height="66" rx="12" class="model"/>
  <text x="707" y="212" class="label">Autoencoder</text>
  <text x="707" y="233" class="sub">Reconstruction</text>
  <rect x="640" y="264" width="135" height="66" rx="12" class="model"/>
  <text x="707" y="294" class="label">LOF</text>
  <text x="707" y="315" class="sub">Local density</text>

  <rect x="835" y="145" width="145" height="90" rx="12" class="accent"/>
  <text x="907" y="177" class="label">Ensemble</text>
  <text x="907" y="201" class="sub">Fixed ECDFs</text>
  <text x="907" y="220" class="sub">Equal-weight fusion</text>

  <rect x="1030" y="145" width="125" height="90" rx="12" class="siem"/>
  <text x="1092" y="181" class="label">Wazuh</text>
  <text x="1092" y="207" class="sub">JSON alerts</text>

  <path d="M190 190 H235" class="line"/>
  <path d="M380 190 H425" class="line"/>
  <path d="M585 190 H615 V133 H640" class="line"/>
  <path d="M615 190 V215 H640" class="line"/>
  <path d="M615 190 V297 H640" class="line"/>
  <path d="M775 133 H805 V190 H835" class="line"/>
  <path d="M775 215 H835" class="line"/>
  <path d="M775 297 H805 V190 H835" class="line"/>
  <path d="M980 190 H1030" class="line"/>

  <text x="600" y="385" class="sub">Only flows above the calibrated threshold become SIEM alerts; flow evidence remains separate.</text>
</svg>
